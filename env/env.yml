name: hfg
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch-cuda=12.1
  - pip:
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch==2.5.1
      - --find-links https://data.pyg.org/whl/torch-2.5.1+cu121.html
      - pyg-lib
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv
      - torch-geometric
      - networkx==3.2.1
      - matplotlib==3.8.4
      - scikit-learn==1.4.2
      - numpy==1.26.4
